name: Deploy to GitHub Pages

on:
  push:
    branches: [main, gemunao]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # 対戦サーバーの URL。リポジトリの Actions 変数 SERVER_URL があればそれを優先し、
          # なければ Cloudflare に公開している対戦サーバーを使う
          VITE_SERVER_URL: ${{ vars.SERVER_URL || 'https://transparent-mahjong-web.alones-aqua.workers.dev' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
