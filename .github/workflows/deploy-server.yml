name: Deploy game server (Cloudflare)

# 対戦サーバーを Cloudflare Workers にデプロイする。
# 必要なシークレット（Settings → Secrets and variables → Actions → Secrets）:
#   CLOUDFLARE_API_TOKEN  … 「Edit Cloudflare Workers」テンプレートで作った API トークン
#   CLOUDFLARE_ACCOUNT_ID … Cloudflare ダッシュボードのアカウント ID
on:
  push:
    branches: [main, gemunao]
    paths:
      - 'server/**'
      - 'src/engine/**'
      - 'src/net/host.ts'
      - 'src/net/names.ts'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secrets
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN が未設定のため、サーバーのデプロイをスキップします"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        run: npm ci && npm test
      - if: steps.check.outputs.skip != 'true'
        working-directory: server
        run: npm ci && npx tsc --noEmit
      - if: steps.check.outputs.skip != 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
