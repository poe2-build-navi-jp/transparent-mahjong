# Cloudflare Workers で「画面（dist）」と「対戦サーバー」を同じ URL で公開するための設定。
# Cloudflare ダッシュボードでこのリポジトリをインポートした Worker（transparent-mahjong-web）が使う。
# ビルド: npm run build  /  デプロイ: npx wrangler deploy
name = "transparent-mahjong-web"
main = "server/src/index.ts"
compatibility_date = "2026-01-01"

[assets]
# 画面のファイル。/api/ 以外のリクエストはここから返す
directory = "./dist"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# 無料プランで使える SQLite バックエンドの Durable Object
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
# 接続を許可するオリジン（カンマ区切り）。空なら全て許可。
ALLOWED_ORIGINS = ""
