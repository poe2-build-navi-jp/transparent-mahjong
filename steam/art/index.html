<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Steam art</title>
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; }
    .art { position: relative; overflow: hidden; }
    .bg { position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 70% 80% at 50% 45%, #2f8c7a 0%, #1f6b5d 40%, #154d45 70%, #0a2724 100%); }
    .bg::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 120%, rgba(233,196,106,.18), transparent 55%); }
    .tiles { position: absolute; inset: 0; }
    .tiles .t { position: absolute; filter: drop-shadow(0 12px 18px rgba(0,0,0,.45)); }
    .logo { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; inset: 0; }
    .jp { font-family: "Noto Serif JP", serif; font-weight: 900; letter-spacing: .06em; line-height: 1; display: flex; }
    .jp .l1 { color: transparent; -webkit-text-stroke: .02em rgba(220,245,255,.95); text-shadow: 0 0 .25em rgba(140,220,255,.7);
      background: linear-gradient(180deg, rgba(255,255,255,.4), rgba(160,220,255,.1)); -webkit-background-clip: text; background-clip: text; }
    .jp .l2 { background: linear-gradient(180deg, #fff3cf, #e9c46a 55%, #b8893b); -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 .06em .1em rgba(0,0,0,.5)); }
    .en { font-family: "M PLUS Rounded 1c", sans-serif; font-weight: 900; letter-spacing: .4em; color: #e6fbff; text-shadow: 0 0 .5em rgba(140,220,255,.8), 0 2px 4px rgba(0,0,0,.6); margin-top: .35em; padding-left: .4em; }
    .sub { font-family: "M PLUS Rounded 1c", sans-serif; font-weight: 700; color: #fff3cf; text-shadow: 0 2px 6px rgba(0,0,0,.7); margin-top: .6em; letter-spacing: .06em; white-space: nowrap; text-align: center; }
    .icon { position: relative; overflow: hidden; display: grid; place-items: center; border-radius: 0; }
    .icon .glyph { position: absolute; inset: 0; display: grid; place-items: center; font-family: "Noto Serif JP", serif; font-weight: 900; }
    .gray { filter: grayscale(1) brightness(.55); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import '/src/ui/fonts.css';
    import '/src/ui/styles.css';
    import { tileHtml } from '/src/ui/table.ts';

    const q = new URLSearchParams(location.search);
    const kind = q.get('kind');
    const w = Number(q.get('w'));
    const h = Number(q.get('h'));
    const root = document.getElementById('root');

    // 牌を散らす（位置は比率で指定。毎回同じ配置になるよう固定）
    const scatter = (list, size) => list.map(([id, x, y, r, s]) => {
      const sc = (s ?? 1) * size;
      return `<div class="t" style="left:${x * w}px;top:${y * h}px;transform:translate(-50%,-50%) rotate(${r}deg) scale(${sc})">${tileHtml(id, { size: 'hand' })}</div>`;
    }).join('');
    const TILES = [
      [33 * 4 + 1, .09, .25, -14], [1, .2, .78, 10, .9], [41, .88, .22, 12], [73, .8, .8, -8, .9], [27 * 4 + 2, .05, .7, 18, .8],
      [31 * 4 + 1, .95, .55, -16, .8], [13 * 4 + 1, .32, .12, 6, .7], [22 * 4 + 2, .68, .1, -6, .7], [0, .3, .92, -4, .75], [32 * 4, .72, .93, 5, .75],
    ];

    const logo = (fs, opts = {}) => `<div class="logo">
      <div class="jp" style="font-size:${fs}px"><span class="l1">透明</span><span class="l2">麻雀</span></div>
      ${opts.en === false ? '' : `<div class="en" style="font-size:${fs * 0.2}px">TRANSPARENT MAHJONG</div>`}
      ${opts.sub ? `<div class="sub" style="font-size:${fs * 0.16}px">${opts.sub}</div>` : ''}
    </div>`;

    document.body.style.width = w + 'px';
    document.body.style.height = h + 'px';
    const tileScale = Math.min(w, h) / 430;
    if (kind === 'logo') {
      root.innerHTML = `<div class="art" style="width:${w}px;height:${h}px">${logo(Math.min(w / 4.6, h / 2.2))}</div>`;
    } else if (kind === 'hero') {
      // ライブラリのヒーロー画像（文字なし）
      root.innerHTML = `<div class="art" style="width:${w}px;height:${h}px"><div class="bg"></div><div class="tiles">${scatter(TILES, h / 520)}</div></div>`;
    } else if (kind === 'icon') {
      const glyph = q.get('glyph') || '透';
      const gray = q.get('gray') === '1';
      // ガラスの牌を模したカードの上に1文字
      root.innerHTML = `<div class="icon ${gray ? 'gray' : ''}" style="width:${w}px;height:${h}px">
        <div class="bg"></div>
        <div style="position:absolute;left:${w * 0.2}px;top:${h * 0.08}px;width:${w * 0.6}px;height:${h * 0.84}px;border-radius:${w * 0.08}px;
          background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.08) 40%,rgba(190,235,255,.12) 62%,rgba(255,255,255,.35));
          box-shadow:inset 0 0 0 ${Math.max(1, w * 0.012)}px rgba(255,255,255,.8),inset 0 0 ${w * 0.12}px rgba(170,230,255,.4),0 ${w * 0.03}px ${w * 0.06}px rgba(0,0,0,.45)"></div>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif JP',serif;font-weight:900;
          font-size:${w * 0.44}px;line-height:1;color:${gray ? '#d8d8d8' : '#ffefc2'};text-shadow:0 0 ${w * 0.06}px rgba(255,200,90,.9),0 ${w * 0.01}px ${w * 0.02}px rgba(0,0,0,.6)">${glyph}</div>
      </div>`;
    } else {
      const fs = kind === 'small' ? h * 0.42 : kind === 'vertical' || kind === 'library' ? w * 0.19 : kind === 'main' || kind === 'page' ? Math.min(w / 6.2, h / 3.8) : Math.min(w / 4.4, h / 2.6);
      const sub = kind === 'main' || kind === 'page' ? (q.get('lang') === 'en' ? 'Three of every four tiles are see-through.' : '４枚のうち３枚は透けて見える') : '';
      const portrait = h > w;
      // 縦長はロゴを上に、牌は下半分に
      const tiles = portrait
        ? TILES.map(([id, x, y, r, sc]) => [id, x, 0.5 + y * 0.48, r, sc])
        : TILES;
      const logoHtml = portrait
        ? logo(fs, { sub }).replace('class="logo"', 'class="logo" style="justify-content:flex-start;padding-top:' + (h * 0.12) + 'px"')
        : logo(fs, { sub });
      root.innerHTML = `<div class="art" style="width:${w}px;height:${h}px"><div class="bg"></div>
        <div class="tiles">${kind === 'small' ? '' : scatter(tiles, tileScale)}</div>${logoHtml}</div>`;
    }
    document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });
  </script>
</body>
</html>
