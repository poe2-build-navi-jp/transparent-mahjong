# Cloudflare Workers で「画面（dist）」と「対戦サーバー」を同じ URL で公開するための設定。
# Cloudflare ダッシュボードでこのリポジトリをインポートした Worker（transparent-mahjong-web）が使う。
# ビルド: npm run build  /  デプロイ: npx wrangler deploy
name = "transparent-mahjong-web"
main = "server/src/index.ts"
compatibility_date = "2026-01-01"

[assets]
# 画面のファイル。/api/ 以外のリクエストはここから返す
directory = "./dist"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "QUOTA"
class_name = "Quota"

# 無料プランで使える SQLite バックエンドの Durable Object
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Quota"]

[vars]
# 接続を許可するオリジン（カンマ区切り）。空なら全て許可。
ALLOWED_ORIGINS = ""
# 1日あたりの無料オンライン対局数（日本時間0時にリセット）。"0" にすると制限なし
FREE_GAMES_PER_DAY = "1"
# 1つの接続元が1分間に作れるルーム数
ROOMS_PER_MINUTE = "5"
# プレミアム判定に使う RevenueCat の entitlement ID
PREMIUM_ENTITLEMENT = "premium"
# RevenueCat のシークレット API キーは wrangler secret put REVENUECAT_API_KEY で設定する（ここには書かない）
